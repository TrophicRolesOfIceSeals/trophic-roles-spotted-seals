name: Zenodo Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Run Zenodo Deploy
      uses: nmfs-opensci/zenodo-gha@main
      with:
        token: ${{ secrets.ZENODO_TOKEN }}
        zenodo_json: CITATION.cff   # either a .zenodo.json file or CITATION.cff
